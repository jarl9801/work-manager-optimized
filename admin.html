<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Manager - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --bg-hover: #2d2d2d;
            --border: #333;
            --border-light: #444;
            --text-primary: #f5f5f5;
            --text-secondary: #999;
            --text-muted: #666;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            font-size: 14px;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .sidebar-header h1::before { content: "⚡"; }
        .sidebar-header .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .nav-section { padding: 12px 0; }
        .nav-section-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); padding: 8px 20px; letter-spacing: 0.5px; font-weight: 500; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 20px;
            color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
            font-size: 14px; border-left: 3px solid transparent;
        }
        .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .nav-item.active { background: var(--bg-tertiary); color: var(--text-primary); border-left-color: var(--accent); }
        .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
        .nav-item .badge { margin-left: auto; background: var(--bg-primary); padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .sidebar-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--border); }
        .lang-switch { display: flex; gap: 8px; }
        .lang-btn { padding: 6px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-secondary); cursor: pointer; font-size: 12px; }
        .lang-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
        
        /* Main */
        .main { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-height: 100vh; }
        .header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); position: sticky; top: 0; z-index: 100; }
        .header h2 { font-size: 20px; font-weight: 600; }
        .header-actions { display: flex; gap: 10px; }
        
        .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-primary); transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        
        .content { flex: 1; padding: 24px; overflow-y: auto; }
        
        /* KPIs */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .kpi-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
        .kpi-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .kpi-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .kpi-icon.blue { background: rgba(59, 130, 246, 0.15); }
        .kpi-icon.green { background: rgba(34, 197, 94, 0.15); }
        .kpi-icon.orange { background: rgba(245, 158, 11, 0.15); }
        .kpi-icon.purple { background: rgba(99, 102, 241, 0.15); }
        .kpi-value { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
        .kpi-sub { font-size: 12px; color: var(--text-muted); }
        
        /* Cards */
        .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .card-title { font-size: 15px; font-weight: 600; }
        .card-body { padding: 0; }
        .card-body.padded { padding: 20px; }
        
        /* Tables */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; color: var(--text-secondary); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        tr:last-child td { border-bottom: none; }
        
        /* Badges */
        .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
        .badge-blue { background: rgba(59, 130, 246, 0.15); color: var(--info); }
        .badge-green { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .badge-orange { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-red { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge-purple { background: rgba(99, 102, 241, 0.15); color: var(--accent); }
        .badge-gray { background: var(--bg-tertiary); color: var(--text-secondary); }
        
        .progress { height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); transition: width 0.3s; border-radius: 4px; }
        .progress-bar.green { background: var(--success); }
        
        /* Filters */
        .filters { display: flex; gap: 12px; padding: 16px 20px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .filter-input { padding: 8px 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 13px; min-width: 180px; }
        .filter-input:focus { outline: none; border-color: var(--accent); }
        
        /* Section visibility */
        .section { display: none; }
        .section.active { display: block; }
        
        /* Forms */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-grid .full-width { grid-column: 1 / -1; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .form-input, .form-select { width: 100%; padding: 10px 14px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; }
        .form-input:focus { outline: none; border-color: var(--accent); }
        textarea.form-input { resize: vertical; min-height: 80px; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; padding: 4px; line-height: 1; }
        .modal-close:hover { color: var(--text-primary); }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
        
        /* Upload */
        .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.15s; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.05); }
        .upload-area.dragover { border-color: var(--accent); background: rgba(99, 102, 241, 0.1); }
        .upload-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-text { color: var(--text-secondary); margin-bottom: 8px; }
        .upload-hint { font-size: 12px; color: var(--text-muted); }
        
        /* Toast */
        .toast-98 { position: fixed; bottom: 24px; right: 24px; background: var(--bg-secondary); border: 1px solid var(--border); padding: 14px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 2000; }
        .toast-98.show { transform: translateY(0); opacity: 1; }
        
        /* Report */
        .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .report-stat { background: var(--bg-tertiary); padding: 16px; border-radius: 10px; text-align: center; }
        .report-stat .value { font-size: 28px; font-weight: 700; }
        .report-stat .label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
        
        .actions { display: flex; gap: 6px; }
        .action-btn { padding: 6px 10px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all 0.15s; }
        .action-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .action-btn.danger:hover { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        
        /* Status dots */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-dot.green { background: var(--success); }
        .status-dot.orange { background: var(--warning); }
        .status-dot.red { background: var(--danger); }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Work Manager</h1>
            <div class="subtitle">Gestión de Fibra Óptica</div>
        </div>
        
        <nav class="nav-section">
            <div class="nav-section-title">Principal</div>
            <div class="nav-item active" data-section="dashboard"><span class="icon">📊</span> Dashboard</div>
            <div class="nav-item" data-section="clients"><span class="icon">👥</span> Clientes <span class="badge" id="navClientCount">0</span></div>
            <div class="nav-item" data-section="projects"><span class="icon">📁</span> Proyectos <span class="badge" id="navProjectCount">0</span></div>
        </nav>
        
        <nav class="nav-section">
            <div class="nav-section-title">Órdenes de Trabajo</div>
            <div class="nav-item" data-section="orders-ra"><span class="icon">🔵</span> Soplado RA <span class="badge" id="navRACount">0</span></div>
            <div class="nav-item" data-section="orders-rd"><span class="icon">🟠</span> Soplado RD <span class="badge" id="navRDCount">0</span></div>
            <div class="nav-item" data-section="orders-fusion"><span class="icon">🟣</span> Fusión <span class="badge" id="navFusionCount">0</span></div>
        </nav>
        
        <nav class="nav-section">
            <div class="nav-section-title">Reportes</div>
            <div class="nav-item" data-section="go-status"><span class="icon">📋</span> GO Status <span class="badge" id="navGOCount">0</span></div>
            <div class="nav-item" data-section="newworks"><span class="icon">🆕</span> Nuevos Trabajos</div>
            <div class="nav-item" data-section="invoicing"><span class="icon">💰</span> Facturación</div>
            <div class="nav-item" data-section="prices"><span class="icon">📝</span> Precios</div>
        </nav>
        
        <nav class="nav-section">
            <div class="nav-section-title">Importar</div>
            <div class="nav-item" data-section="import"><span class="icon">📥</span> Importar CSV</div>
        </nav>
        
        <div class="sidebar-footer">
            <div class="lang-switch">
                <button class="lang-btn active" onclick="setLang('es')">ES</button>
                <button class="lang-btn" onclick="setLang('de')">DE</button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <header class="header">
            <h2 id="sectionTitle">Dashboard</h2>
            <div class="header-actions">
                <button class="btn" onclick="showSection('import')">📥 Importar</button>
                <button class="btn btn-primary" id="newItemBtn" onclick="openNewItemModal()">+ Nuevo</button>
            </div>
        </header>
        
        <div class="content" id="mainContent">
            <!-- Content rendered by JS -->
        </div>
    </main>
    
    <!-- Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="adminModalTitle">Modal</span>
                <button class="modal-close" onclick="closeAdminModal()">&times;</button>
            </div>
            <div class="modal-body" id="adminModalBody"></div>
            <div class="modal-footer">
                <button class="btn" onclick="closeAdminModal()">Cancelar</button>
                <button class="btn btn-primary" id="adminModalSave">Guardar</button>
            </div>
        </div>
    </div>
    
    <!-- Toast (separate from win98 toast) -->
    <div class="toast-98" id="adminToast"><span id="adminToastMsg"></span></div>
    
    <!-- Hidden file input for CSV -->
    <input type="file" id="adminCsvInput" accept=".csv" multiple style="display:none">

    <!-- Load win98 app logic (all the same functions) -->
    <script src="data/prices.js"></script>
    <script src="js/win98-app.js"></script>
    
    <script>
    // ============================================
    // ADMIN UI LAYER
    // Reuses ALL logic from win98-app.js
    // Only provides different rendering
    // ============================================
    
    let adminCurrentSection = 'dashboard';
    let adminEditingItem = null;
    
    // Override toast to use admin toast
    const originalToast = toast;
    function adminToast(msg) {
        const el = document.getElementById('adminToast');
        document.getElementById('adminToastMsg').textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
        // Also call original for reports
        originalToast(msg);
    }
    
    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => showSection(item.dataset.section));
    });
    
    function showSection(section) {
        if (!section) return;
        adminCurrentSection = section;
        document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.section === section));
        
        const titles = {
            'dashboard': 'Dashboard', 'clients': 'Clientes', 'projects': 'Proyectos',
            'orders-ra': 'Soplado RA', 'orders-rd': 'Soplado RD', 'orders-fusion': 'Fusión',
            'go-status': 'GO Status', 'newworks': 'Nuevos Trabajos', 'invoicing': 'Facturación',
            'prices': 'Precios', 'import': 'Importar CSV'
        };
        document.getElementById('sectionTitle').textContent = titles[section] || section;
        
        adminRender();
    }
    
    function updateNavCounts() {
        document.getElementById('navClientCount').textContent = clients.length;
        document.getElementById('navProjectCount').textContent = getProjectCodes().length;
        document.getElementById('navRACount').textContent = ordersRA.length;
        document.getElementById('navRDCount').textContent = ordersRD.length;
        document.getElementById('navFusionCount').textContent = ordersFusion.length;
        document.getElementById('navGOCount').textContent = goStatus.length;
    }
    
    function getProjectCodes() {
        return [...new Set([
            ...clients.map(c => c.projectCode),
            ...ordersRA.map(o => o.projectCode),
            ...ordersRD.map(o => o.projectCode),
            ...ordersFusion.map(o => o.projectCode),
            ...goStatus.map(g => g.projectCode)
        ].filter(Boolean))].sort();
    }
    
    function statusBadge(status) {
        const map = { 'Fertig': 'green', '109': 'blue', '108': 'purple', '103': 'orange', '102': 'orange', '101': 'gray', '100': 'gray', '0': 'red' };
        const labels = { 'Fertig': 'Fertig', '109': '109', '108': '108', '103': '103', '102': '102', '101': '101', '100': '100', '0': '0' };
        return `<span class="badge badge-${map[status] || 'gray'}">${labels[status] || status || '-'}</span>`;
    }
    
    function projectFilterOptions() {
        return '<option value="">Todos</option>' + getProjectCodes().map(c => `<option value="${c}">${c}</option>`).join('');
    }
    
    // Main render function
    function adminRender() {
        updateNavCounts();
        const content = document.getElementById('mainContent');
        
        switch(adminCurrentSection) {
            case 'dashboard': content.innerHTML = renderDashboard(); break;
            case 'clients': content.innerHTML = renderClients(); break;
            case 'projects': content.innerHTML = renderProjects(); break;
            case 'orders-ra': content.innerHTML = renderOrdersRA(); break;
            case 'orders-rd': content.innerHTML = renderOrdersRD(); break;
            case 'orders-fusion': content.innerHTML = renderOrdersFusion(); break;
            case 'go-status': content.innerHTML = renderGoStatus(); break;
            case 'newworks': content.innerHTML = renderNewWorks(); break;
            case 'invoicing': content.innerHTML = renderInvoicing(); break;
            case 'prices': content.innerHTML = renderPrices(); break;
            case 'import': content.innerHTML = renderImport(); setupUpload(); break;
            default: content.innerHTML = '<div class="empty-state"><div class="icon">🚧</div><p>Sección en construcción</p></div>';
        }
    }
    
    function renderDashboard() {
        const projectCodes = getProjectCodes();
        
        // Build GO status lookup
        const goByProjDP = {};
        goStatus.forEach(g => { goByProjDP[(g.projectCode || '') + '|' + g.dp] = g; });
        
        // Calculate real GEREED totals
        let totalGereed = 0;
        let totalWarnings = 0;
        const allDPs = new Set();
        
        projectCodes.forEach(code => {
            const dpsSet = new Set([
                ...clients.filter(c => c.projectCode === code).map(c => c.dp),
                ...goStatus.filter(g => g.projectCode === code).map(g => g.dp)
            ].filter(Boolean));
            
            dpsSet.forEach(dp => {
                allDPs.add(code + '|' + dp);
                const g = goByProjDP[code + '|' + dp];
                const blowOK = g?.einblasenAPDP?.toUpperCase().includes('GEREED');
                const spliceAPOK = g?.spleissenAP?.toUpperCase().includes('GEREED');
                const spliceDPOK = g?.spleisseDPbereit?.toUpperCase().includes('GEREED');
                const allGO = blowOK && spliceAPOK && spliceDPOK;
                
                const hasRD = ordersRD.some(o => o.projectCode === code && o.dp === dp);
                const hasFusion = ordersFusion.some(o => o.projectCode === code && o.dp === dp);
                
                if (allGO) totalGereed++;
                if ((hasRD && !blowOK) || (hasFusion && !spliceAPOK && !spliceDPOK)) totalWarnings++;
            });
        });
        
        let projectRows = projectCodes.map(code => {
            const projClients = clients.filter(c => c.projectCode === code);
            const dpsSet = new Set([
                ...projClients.map(c => c.dp),
                ...goStatus.filter(g => g.projectCode === code).map(g => g.dp)
            ].filter(Boolean));
            const dps = dpsSet.size;
            
            const ra = ordersRA.filter(o => o.projectCode === code).length;
            const rd = ordersRD.filter(o => o.projectCode === code).length;
            const fusion = ordersFusion.filter(o => o.projectCode === code).length;
            
            // Calculate GEREED per project
            let projGereed = 0;
            let projWarnings = 0;
            dpsSet.forEach(dp => {
                const g = goByProjDP[code + '|' + dp];
                const blowOK = g?.einblasenAPDP?.toUpperCase().includes('GEREED');
                const spliceAPOK = g?.spleissenAP?.toUpperCase().includes('GEREED');
                const spliceDPOK = g?.spleisseDPbereit?.toUpperCase().includes('GEREED');
                const allGO = blowOK && spliceAPOK && spliceDPOK;
                
                const hasRD = ordersRD.some(o => o.projectCode === code && o.dp === dp);
                const hasFusion = ordersFusion.some(o => o.projectCode === code && o.dp === dp);
                
                if (allGO) projGereed++;
                if ((hasRD && !blowOK) || (hasFusion && !spliceAPOK && !spliceDPOK)) projWarnings++;
            });
            
            const progress = dps ? Math.round(projGereed / dps * 100) : 0;
            const goStatusHtml = projWarnings > 0 
                ? `<span class="badge badge-red">⚠️ ${projWarnings}</span>`
                : projGereed === dps && dps > 0 
                    ? '<span class="badge badge-green">✓</span>'
                    : `<span class="badge badge-orange">${projGereed}/${dps}</span>`;
            
            return `<tr>
                <td><strong>${code}</strong></td>
                <td>${dps}</td>
                <td>${projClients.length}</td>
                <td><span class="badge badge-blue">${ra}</span> <span class="badge badge-orange">${rd}</span></td>
                <td><span class="badge badge-purple">${fusion}</span></td>
                <td>${goStatusHtml}</td>
                <td style="min-width:150px">
                    <div class="progress"><div class="progress-bar ${progress === 100 ? 'green' : ''}" style="width:${progress}%"></div></div>
                    <small style="color:var(--text-muted)">${projGereed}/${dps} (${progress}%)</small>
                </td>
            </tr>`;
        }).join('');
        
        if (!projectRows) projectRows = '<tr><td colspan="7" class="empty-state">No hay proyectos. Importa un CSV para comenzar.</td></tr>';
        
        return `
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-header"><span class="kpi-label">Proyectos</span><div class="kpi-icon blue">📁</div></div>
                    <div class="kpi-value">${projectCodes.length}</div>
                </div>
                <div class="kpi-card">

    function renderProjects() {
        const projectCodes = getProjectCodes();
        
        // Build GO status lookup
        const goByProjDP = {};
        goStatus.forEach(g => { goByProjDP[(g.projectCode || '') + '|' + g.dp] = g; });
        
        const rows = projectCodes.map(code => {
            const proj = projects.find(p => p.code === code) || {};
            const projClients = clients.filter(c => c.projectCode === code);
            const dpsSet = new Set([
                ...projClients.map(c => c.dp),
                ...goStatus.filter(g => g.projectCode === code).map(g => g.dp)
            ].filter(Boolean));
            const dps = dpsSet.size;
            
            // Calculate real GEREED status per DP
            let totalGereed = 0;
            let totalParcial = 0;
            let totalFaltaGO = 0;
            let warnings = [];
            
            dpsSet.forEach(dp => {
                const g = goByProjDP[code + '|' + dp];
                const blowOK = g?.einblasenAPDP?.toUpperCase().includes('GEREED');
                const spliceAPOK = g?.spleissenAP?.toUpperCase().includes('GEREED');
                const spliceDPOK = g?.spleisseDPbereit?.toUpperCase().includes('GEREED');
                
                const hasRD = ordersRD.some(o => o.projectCode === code && (typeof normalizeDP === 'function' ? normalizeDP(o.dp) === normalizeDP(dp) : o.dp === dp));
                const hasFusion = ordersFusion.some(o => o.projectCode === code && (typeof normalizeDP === 'function' ? normalizeDP(o.dp) === normalizeDP(dp) : o.dp === dp));
                
                const allGO = blowOK && spliceAPOK && spliceDPOK;
                const anyGO = blowOK || spliceAPOK || spliceDPOK;
                
                if (allGO) {
                    totalGereed++;
                } else if (anyGO) {
                    totalParcial++;
                    // Check for warnings
                    if (hasRD && !blowOK) warnings.push(`${dp}: Soplado sin GEREED`);
                    if (hasFusion && !spliceAPOK && !spliceDPOK) warnings.push(`${dp}: Fusión sin GEREED`);
                } else if (hasRD || hasFusion) {
                    totalFaltaGO++;
                    if (hasRD) warnings.push(`${dp}: Soplado hecho, falta GO`);
                    if (hasFusion) warnings.push(`${dp}: Fusión hecha, falta GO`);
                }
            });
            
            // Status based on GO, not just client field
            const fertigReal = totalGereed;
            const progressReal = dps ? Math.round(totalGereed / dps * 100) : 0;
            
            // Project status badge
            let goStatusHtml;
            if (warnings.length > 0) {
                goStatusHtml = `<span class="badge badge-red" title="${warnings.slice(0,3).join('\n')}">⚠️ ${warnings.length} alertas</span>`;
            } else if (totalGereed === dps && dps > 0) {
                goStatusHtml = '<span class="badge badge-green">✓ Completo</span>';
            } else if (totalParcial > 0) {
                goStatusHtml = `<span class="badge badge-orange">Parcial (${totalParcial})</span>`;
            } else if (totalFaltaGO > 0) {
                goStatusHtml = `<span class="badge badge-red">Falta GO (${totalFaltaGO})</span>`;
            } else {
                goStatusHtml = '<span class="badge badge-gray">Pendiente</span>';
            }
            
            return `<tr>
                <td><strong>${code}</strong></td>
                <td>${proj.name || '-'}</td>
                <td>${proj.client || '-'}</td>
                <td>${dps}</td>
                <td>${projClients.length}</td>
                <td style="color:${fertigReal === dps && dps > 0 ? 'var(--success)' : 'inherit'}">${fertigReal}/${dps}</td>
                <td style="min-width:120px"><div class="progress"><div class="progress-bar ${progressReal === 100 ? 'green' : ''}" style="width:${progressReal}%"></div></div><small style="color:var(--text-muted)">${progressReal}%</small></td>
                <td>${goStatusHtml}</td>
                <td class="actions">
                    <button class="action-btn" onclick="editProjectAdmin('${code}')">✏️</button>
                    <button class="action-btn danger" onclick="deleteProjectAdmin('${code}')">🗑️</button>
                </td>
            </tr>`;
        }).join('') || '<tr><td colspan="9" class="empty-state">No hay proyectos</td></tr>';
        
        return `
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Proyectos</span>
                    <button class="btn btn-sm" onclick="openProjectModalAdmin()">+ Nuevo Proyecto</button>
                </div>
                <div class="card-body"><div class="table-container"><table>
                    <thead><tr><th>Código</th><th>Nombre</th><th>Cliente</th><th>DPs</th><th>Clientes</th><th>GEREED</th><th>Progreso</th><th>Estado GO</th><th>Acciones</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table></div></div>
            </div>
        `;
    }

    function filterGO() {
        const search = (document.getElementById('goSearch')?.value || '').toLowerCase();
        const proj = document.getElementById('goProjectFilter')?.value || '';
        const statusFilter = document.getElementById('goStatusFilter')?.value || '';
        
        let filtered = goStatus;
        if (search) filtered = filtered.filter(g => (g.projectCode || '').toLowerCase().includes(search) || (g.dp || '').toLowerCase().includes(search));
        if (proj) filtered = filtered.filter(g => g.projectCode === proj);
        if (statusFilter === 'complete') filtered = filtered.filter(g => {
            const blow = (g.einblasenAPDP || '').toUpperCase().includes('GEREED');
            const spliceAP = (g.spleissenAP || '').toUpperCase().includes('GEREED');
            const spliceDP = (g.spleisseDPbereit || '').toUpperCase().includes('GEREED');
            return blow && spliceAP && spliceDP; // Los 3
        });
        if (statusFilter === 'pending') filtered = filtered.filter(g => {
            const blow = (g.einblasenAPDP || '').toUpperCase().includes('GEREED');
            const spliceAP = (g.spleissenAP || '').toUpperCase().includes('GEREED');
            const spliceDP = (g.spleisseDPbereit || '').toUpperCase().includes('GEREED');
            return !(blow && spliceAP && spliceDP);
        });
        
        document.getElementById('goTableBody').innerHTML = filtered.length ? filtered.map(g => {
            const blow = (g.einblasenAPDP || '').toUpperCase().includes('GEREED');
            const spliceAP = (g.spleissenAP || '').toUpperCase().includes('GEREED');
            const spliceDP = (g.spleisseDPbereit || '').toUpperCase().includes('GEREED');
            const complete = blow && spliceAP && spliceDP; // Los 3 deben tener GEREED
            const parcial = (blow || spliceAP || spliceDP) && !complete;
            
            let statusHtml;
            if (complete) {
                statusHtml = '<span class="badge badge-green">✓ Completo</span>';
            } else if (parcial) {
                statusHtml = '<span class="badge badge-orange">Parcial</span>';
            } else {
                statusHtml = '<span class="badge badge-gray">Pendiente</span>';
            }
            
            return `<tr>
                <td><strong>${g.projectCode || '-'}</strong></td>
                <td>${g.dp || '-'}</td>
                <td>${blow ? '<span class="badge badge-green">GEREED</span>' : '<span class="badge badge-gray">-</span>'}</td>
                <td>${spliceAP ? '<span class="badge badge-green">GEREED</span>' : '<span class="badge badge-gray">-</span>'}</td>
                <td>${spliceDP ? '<span class="badge badge-green">GEREED</span>' : '<span class="badge badge-gray">-</span>'}</td>
                <td>${statusHtml}</td>
            </tr>`;
        }).join('') : '<tr><td colspan="6" class="empty-state">No hay datos de GO Status</td></tr>';
    }

            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-header"><span class="kpi-label">Pendientes</span><div class="kpi-icon orange">⏳</div></div><div class="kpi-value">${pending.length}</div></div>
                <div class="kpi-card"><div class="kpi-header"><span class="kpi-label">Facturados</span><div class="kpi-icon green">✅</div></div><div class="kpi-value">${invoiced.length}</div></div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title">Trabajos por Facturar</span></div>
                <div class="card-body"><div class="table-container"><table>
                    <thead><tr><th>Proyecto</th><th>DP</th><th>Tipo</th><th>Fecha</th><th>Acción</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table></div></div>
            </div>
        `;
    }
    
    function renderPrices() {
        if (typeof PRICE_LIST === 'undefined' || !PRICE_LIST.length) {
            return '<div class="empty-state"><div class="icon">📝</div><p>No hay precios configurados</p></div>';
        }
        
        let totalMargin = 0, count = 0;
        const rows = PRICE_LIST.map(p => {
            const margin = p.sale && p.cost ? (p.sale - p.cost) : 0;
            const marginPct = p.sale ? Math.round(margin / p.sale * 100) : 0;
            if (marginPct > 0) { totalMargin += marginPct; count++; }
            
            return `<tr>
                <td><strong>${p.code || '-'}</strong></td>
                <td>${p.desc || '-'}</td>
                <td>${p.unit || '-'}</td>
                <td>€${(p.sale || 0).toFixed(2)}</td>
                <td>€${(p.cost || 0).toFixed(2)}</td>
                <td><span class="badge badge-${marginPct > 20 ? 'green' : marginPct > 10 ? 'orange' : 'red'}">${marginPct}%</span></td>
            </tr>`;
        }).join('');
        
        const avgMargin = count ? Math.round(totalMargin / count) : 0;
        
        return `
            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-header"><span class="kpi-label">Total Items</span><div class="kpi-icon blue">📝</div></div><div class="kpi-value">${PRICE_LIST.length}</div></div>
                <div class="kpi-card"><div class="kpi-header"><span class="kpi-label">Margen Promedio</span><div class="kpi-icon green">📈</div></div><div class="kpi-value">${avgMargin}%</div></div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title">Lista de Precios</span></div>
                <div class="card-body"><div class="table-container"><table>
                    <thead><tr><th>Código</th><th>Descripción</th><th>Unidad</th><th>Venta</th><th>Costo</th><th>Margen</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table></div></div>
            </div>
        `;
    }
    
    function renderImport() {
        return `
            <div class="card">
                <div class="card-body padded">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">Arrastra archivos CSV aquí o haz clic para seleccionar</div>
                        <div class="upload-hint">Detecta automáticamente: Clientes GO, GO Status, Soplado RA, Soplado RD, Fusión</div>
                    </div>
                    <div id="importStatus"></div>
                </div>
            </div>
        `;
    }
    
    function setupUpload() {
        const area = document.getElementById('uploadArea');
        const input = document.getElementById('adminCsvInput');
        
        area.onclick = () => input.click();
        area.ondragover = e => { e.preventDefault(); area.classList.add('dragover'); };
        area.ondragleave = () => area.classList.remove('dragover');
        area.ondrop = e => {
            e.preventDefault();
            area.classList.remove('dragover');
            handleAdminImport(e.dataTransfer.files);
        };
        input.onchange = () => {
            handleAdminImport(input.files);
            input.value = '';
        };
    }
    
    async function handleAdminImport(files) {
        const statusEl = document.getElementById('importStatus');
        statusEl.innerHTML = '<div style="color:var(--info)">Procesando...</div>';
        
        // Use win98's smartImport which has all the logic
        const fakeInput = { files: files, value: '' };
        await smartImport(fakeInput);
        
        await loadAll();
        adminRender();
        statusEl.innerHTML = '<div style="color:var(--success)">✓ Importación completada</div>';
    }
    
    // CRUD wrappers that use win98 functions
    function openProjectModalAdmin(data) {
        // Reuse win98's openProjectModal
        openProjectModal(data);
    }
    
    function editProjectAdmin(code) {
        editProject(code);
    }
    
    async function deleteProjectAdmin(code) {
        await deleteProject(code);
        await loadAll();
        adminRender();
    }
    
    async function deleteOrderAdmin(store, id) {
        await deleteOrder(store, id);
        await loadAll();
        adminRender();
    }
    
    async function markInvoicedAdmin(type, id) {
        const store = type === 'RD' ? 'orders_rd' : 'orders_fusion';
        const list = type === 'RD' ? ordersRD : ordersFusion;
        const order = list.find(o => o.id === id);
        if (order) {
            order.invoiced = true;
            order.invoicedAt = new Date().toISOString();
            await dbPut(store, order);
            await loadAll();
            adminRender();
            adminToast('Marcado como facturado');
        }
    }
    
    function openNewItemModal() {
        const modalMap = {
            'projects': () => openProjectModal(),
            'orders-ra': () => openOrderModal('ra'),
            'orders-rd': () => openOrderModal('rd'),
            'orders-fusion': () => openOrderModal('fusion')
        };
        if (modalMap[adminCurrentSection]) modalMap[adminCurrentSection]();
        else adminToast('Selecciona una sección para crear');
    }
    
    function closeAdminModal() {
        document.getElementById('adminModal').classList.remove('show');
    }
    
    // Filter triggers when section loads
    setTimeout(() => {
        if (adminCurrentSection === 'clients') filterClients();
        if (adminCurrentSection === 'orders-ra') filterRA();
        if (adminCurrentSection === 'orders-rd') filterRD();
        if (adminCurrentSection === 'orders-fusion') filterFusion();
        if (adminCurrentSection === 'go-status') filterGO();
    }, 100);
    
    // Override win98's renderOpenWindows to also update admin
    const originalRenderOpenWindows = typeof renderOpenWindows === 'function' ? renderOpenWindows : () => {};
    window.renderOpenWindows = function() {
        originalRenderOpenWindows();
        adminRender();
    };
    
    // Override showImportReport to show in admin modal
    let lastImportReport = null;
    window.showImportReport = function(type, newOrders, duplicates, missing) {
        lastImportReport = { type, newOrders, duplicates, missing, timestamp: new Date().toLocaleString() };
        
        const typeNames = { soplado_ra: 'Soplado RA', soplado_rd: 'Soplado RD', fusion: 'Fusión' };
        const total = newOrders.length + duplicates.length;
        
        // Build discrepancies - work done but not in GO
        const discrepancies = [];
        const goByProjDP = {};
        goStatus.forEach(g => { goByProjDP[(g.projectCode || '') + '|' + g.dp] = g; });
        
        if (type === 'soplado_rd' || type === 'fusion') {
            const orders = type === 'soplado_rd' ? ordersRD : ordersFusion;
            orders.forEach(o => {
                const g = goByProjDP[(o.projectCode || '') + '|' + o.dp];
                if (!g) {
                    discrepancies.push({ dp: o.dp, project: o.projectCode, issue: 'DP no encontrado en GO' });
                } else if (type === 'soplado_rd' && !g.einblasenAPDP?.toUpperCase().includes('GEREED')) {
                    discrepancies.push({ dp: o.dp, project: o.projectCode, issue: 'Soplado hecho, NO GEREED en GO' });
                } else if (type === 'fusion' && !g.spleissenAP?.toUpperCase().includes('GEREED') && !g.spleisseDPbereit?.toUpperCase().includes('GEREED')) {
                    discrepancies.push({ dp: o.dp, project: o.projectCode, issue: 'Fusión hecha, NO GEREED en GO' });
                }
            });
        }
        
        let html = `
            <div class="report-grid">
                <div class="report-stat"><div class="value">${total}</div><div class="label">Total CSV</div></div>
                <div class="report-stat"><div class="value" style="color:var(--success)">${newOrders.length}</div><div class="label">Nuevas</div></div>
                <div class="report-stat"><div class="value" style="color:var(--warning)">${duplicates.length}</div><div class="label">Ya existían</div></div>
                <div class="report-stat"><div class="value" style="color:var(--danger)">${missing.length}</div><div class="label">GEREED sin orden</div></div>
            </div>
        `;
        
        if (discrepancies.length > 0) {
            html += `<div style="margin-top:16px;padding:12px;background:rgba(239,68,68,0.1);border:1px solid var(--danger);border-radius:8px">
                <strong style="color:var(--danger)">⚠️ ${discrepancies.length} trabajos SIN GEREED en GO:</strong>
                <ul style="margin:8px 0 0 20px;font-size:13px">
                    ${discrepancies.slice(0,10).map(d => `<li><strong>${d.project} ${d.dp}</strong>: ${d.issue}</li>`).join('')}
                    ${discrepancies.length > 10 ? `<li>... y ${discrepancies.length - 10} más</li>` : ''}
                </ul>
            </div>`;
        }
        
        if (missing.length > 0) {
            html += `<div style="margin-top:16px;padding:12px;background:rgba(245,158,11,0.1);border:1px solid var(--warning);border-radius:8px">
                <strong style="color:var(--warning)">📋 ${missing.length} GEREED en GO pero SIN orden cargada:</strong>
                <ul style="margin:8px 0 0 20px;font-size:13px">
                    ${missing.slice(0,10).map(m => `<li>${m}</li>`).join('')}
                    ${missing.length > 10 ? `<li>... y ${missing.length - 10} más</li>` : ''}
                </ul>
            </div>`;
        }
        
        if (newOrders.length > 0) {
            html += `<details style="margin-top:16px"><summary style="cursor:pointer;color:var(--success)">✓ ${newOrders.length} órdenes importadas</summary>
                <ul style="margin:8px 0 0 20px;font-size:12px;max-height:150px;overflow-y:auto">
                    ${newOrders.map(o => `<li>${o}</li>`).join('')}
                </ul>
            </details>`;
        }
        
        document.getElementById('adminModalTitle').textContent = 'Reporte de Importación - ' + (typeNames[type] || type);
        document.getElementById('adminModalBody').innerHTML = html;
        document.querySelector('#adminModal .modal-footer').innerHTML = '<button class="btn btn-primary" onclick="closeAdminModal()">Cerrar</button>';
        document.getElementById('adminModal').classList.add('show');
        
        adminToast(`${typeNames[type] || type}: ${newOrders.length} nuevas, ${discrepancies.length} sin GEREED`);
    };
    
    // Init - wait for win98 to load DB then render
    (async function init() {
        // win98-app.js initializes on DOMContentLoaded
        // We wait a bit then load and render
        await new Promise(r => setTimeout(r, 500));
        if (!db) await openDB();
        await loadAll();
        adminRender();
        
        // Setup section filters after render
        setTimeout(() => {
            if (adminCurrentSection === 'clients') filterClients();
        }, 100);
    })();
    </script>
</body>
</html>
